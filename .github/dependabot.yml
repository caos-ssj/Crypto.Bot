version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      runtime:
        patterns:
          - "solana"
          - "solders"
          - "web3"
          - "requests"
          - "httpx"
          - "aiohttp"
          - "python-dotenv"
          - "pyyaml"
          - "pandas"
          - "numpy"
          - "openai"
          - "loguru"
          - "tenacity"
          - "apscheduler"
          - "rich"
          - "streamlit"
      dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "black"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"